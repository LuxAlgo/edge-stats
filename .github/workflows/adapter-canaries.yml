# Daily vendor-schema canaries: each job pulls a TINY recent sample from
# one vendor and fails loudly when the response shape drifts from what the
# adapters in packages/core/src/adapters expect (columns, ordering,
# timestamp units, pagination keys).
#
# Scheduled + manual only. Do NOT add these jobs to branch protection or
# required PR checks — a vendor hiccup must never block a merge.
#
# Keyed vendors (alpaca, databento, massive, lse) skip with exit 0 when
# their repo secret is absent; secrets are exposed to exactly one job each
# and only ever travel as request headers — never in URLs, logs, or
# artifacts.
name: adapter-canaries

on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC — off the top of the hour
  workflow_dispatch:

jobs:
  binance:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/binance-canary.ts

  coinbase:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/coinbase-canary.ts

  alpaca:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/alpaca-canary.ts
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

  databento:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/databento-canary.ts
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}

  massive:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/massive-canary.ts
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

  lse:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/lse-canary.ts
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}

  hyperliquid:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/hyperliquid-canary.ts

  dukascopy:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/canaries/dukascopy-canary.ts
